<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pro Smash 3D Badminton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Critical CSS to ensure full height immediately */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #1a202c; 
      }
      #root { 
        width: 100%; 
        height: 100%; 
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Ensure canvas is behind UI */
      canvas { 
        display: block; 
        outline: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<!-- Global Error Handler to debug startup issues -->
<script>
  window.addEventListener('error', function(event) {
    const root = document.getElementById('root');
    if (root && root.innerText.includes('Loading')) {
      root.innerHTML = '<div style="color: #ef4444; padding: 20px; font-family: monospace; background: rgba(0,0,0,0.8); height: 100%;">' + 
        '<h3 style="font-size: 1.5rem; margin-bottom: 1rem;">Startup Error</h3>' + 
        '<p>' + event.message + '</p>' +
        '<p style="color: #999; margin-top: 1rem; font-size: 0.8rem;">' + (event.filename || '') + ':' + (event.lineno || '') + '</p>' +
      '</div>';
    }
  });
</script>
</head>
  <body>
    <div id="root">
      <!-- Fallback content if React fails to load -->
      <div class="loading-screen" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111827; color: white; font-family: sans-serif; z-index: 50;">
        <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; color: #3b82f6;">Pro Smash 3D</div>
        <div style="width: 40px; height: 40px; border: 4px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 1rem; color: #9ca3af; font-size: 0.875rem;">Initializing Engine...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>

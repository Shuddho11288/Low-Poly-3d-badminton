<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pro Smash 3D Badminton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Critical CSS to ensure full height immediately */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #1a202c; 
      }
      #root { 
        width: 100%; 
        height: 100%; 
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Ensure canvas is behind UI */
      canvas { 
        display: block; 
        outline: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "three": "https://esm.sh/three@0.160.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <!-- Fallback content if React fails to load -->
      <div style="color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: sans-serif;">
        Loading Game...
      </div>
    </div>
  </body>
</html>

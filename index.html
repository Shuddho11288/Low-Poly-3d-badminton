<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pro Smash 3D Badminton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Critical CSS to ensure full height immediately */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #1a202c; 
      }
      #root { 
        width: 100%; 
        height: 100%; 
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Ensure canvas is behind UI */
      canvas { 
        display: block; 
        outline: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<!-- Global Error Handler to debug startup issues -->
<script>
  function showError(title, message, details) {
    const root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<div style="color: #ef4444; padding: 20px; font-family: monospace; background: #111; position: absolute; inset: 0; z-index: 9999; overflow: auto;">' + 
        '<h3 style="font-size: 1.5rem; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 10px;">' + title + '</h3>' + 
        '<div style="background: #330000; padding: 15px; border-radius: 8px; border: 1px solid #600;">' +
        '<p style="font-weight: bold; margin-bottom: 10px;">' + message + '</p>' +
        (details ? '<p style="color: #bbb; font-size: 0.9rem;">' + details + '</p>' : '') +
        '</div>' +
        '<p style="margin-top: 20px; color: #888;">Check the browser console for full logs.</p>' +
      '</div>';
    }
  }

  window.addEventListener('error', function(event) {
    console.error("Critical Startup Error:", event);
    showError('Startup Error', event.message, 'File: ' + (event.filename || 'unknown') + ':' + (event.lineno || '?'));
  });

  window.addEventListener('unhandledrejection', function(event) {
    console.error("Unhandled Promise Rejection:", event.reason);
    showError('Module Load Error', 'Failed to load a required module or resource.', event.reason ? event.reason.toString() : 'Unknown reason');
  });
</script>
</head>
  <body>
    <div id="root">
      <!-- Fallback content if React fails to load -->
      <div class="loading-screen" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111827; color: white; font-family: sans-serif; z-index: 50;">
        <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; color: #3b82f6;">Pro Smash 3D</div>
        <div style="width: 40px; height: 40px; border: 4px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 1rem; color: #9ca3af; font-size: 0.875rem;">Initializing Engine...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
